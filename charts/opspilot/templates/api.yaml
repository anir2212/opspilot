apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: opspilot-api}
  template:
    metadata:
      labels: {app: opspilot-api}
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: IfNotPresent
          command: [uvicorn, opspilot.api:app, --host, 0.0.0.0, --port, "8000"]
          env:
            - name: OPSPILOT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: opspilot-postgres, key: database_url}}
            - {name: OPSPILOT_PROMETHEUS_URL, value: "http://opspilot-prometheus:9090"}
          ports: [{containerPort: 8000}]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-api
  labels: {opspilot-metrics: "true"}
spec:
  selector: {app: opspilot-api}
  ports: [{port: 8000, targetPort: 8000}]
