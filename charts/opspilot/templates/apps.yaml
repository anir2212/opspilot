{{- range $name := list "gateway" "payments" "backups" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-{{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: opspilot-{{ $name }}}
  template:
    metadata:
      labels: {app: opspilot-{{ $name }}}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $.Values.demo.image }}
          imagePullPolicy: IfNotPresent
          command: [uvicorn, opspilot.lite_app:app, --host, 0.0.0.0, --port, "8000"]
          env:
            - {name: OPSPILOT_SERVICE_NAME, value: {{ $name | quote }}}
            - {name: OPSPILOT_PAYMENT_URL, value: "http://opspilot-payments:8000"}
          ports: [{containerPort: 8000}]
          resources:
            {{- toYaml $.Values.demo.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-{{ $name }}
  labels: {opspilot-metrics: "true"}
spec:
  selector: {app: opspilot-{{ $name }}}
  ports: [{port: 8000, targetPort: 8000}]
{{- end }}
