global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: opspilot-lite
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000", "payments:8000", "backups:8000"]
  - job_name: opspilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["opspilot-api:8000"]
