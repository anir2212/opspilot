[project]
name = "opspilot"
version = "0.1.0"
description = "Local-first incident copilot with verifiable evidence and human-approved actions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
agent = ["langgraph>=0.6,<2", "langgraph-checkpoint-postgres>=2,<4"]
analysis = ["numpy>=2,<3", "scikit-learn>=1.5,<2", "statsmodels>=0.14,<1", "pyyaml>=6,<7"]
database = ["sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pgvector>=0.3,<1"]
embeddings = ["fastembed>=0.6,<1"]
mcp = ["mcp>=2,<3"]
bots = ["slack-bolt>=1.20,<2", "microsoft-teams-apps>=2.1,<3"]
telemetry = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
]

[project.scripts]
opspilot-mcp = "opspilot.mcp_server:main"
opspilot-slack = "opspilot.bots.slack_app:main"
opspilot-teams = "opspilot.bots.teams_bot:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.11,<2"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local Docker Compose stack"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_knowledge.py" = ["E501"]
"src/opspilot/api.py" = ["B008"]
"src/opspilot/mocks.py" = ["B008"]
"src/opspilot/actions.py" = ["B008"]
"src/opspilot/change_approval.py" = ["B008"]
